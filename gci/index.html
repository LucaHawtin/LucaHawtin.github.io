<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCI 5.11</title>
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" href="/assets/icons/favicon.ico">
<meta name="theme-color" content="#000000">
<style>
/* Layout: a gradebook — course shelf on the home view; per-course ledger with a score bar and target finder above the assessment table. */
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2a2a2d; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --fg:#f5f5f7; --muted:#86868b; --faint:#6e6e73;
  --accent:#2997ff; --accent-ink:#ffffff; --accent-soft:rgba(41,151,255,.16);
  --earned:#2997ff; --lost:#6e3d37; --remaining:#2c2c2e;
  --bad:#ff6b5e; --bad-soft:rgba(255,107,94,.14); --warn:#ffb340; --warn-soft:rgba(255,179,64,.14);
  --gA:#6fd3a4; --gA-bg:#163a2b; --gB:#62b3ff; --gB-bg:#13304d; --gC:#e5c25a; --gC-bg:#3a3014;
  --gD:#f0a364; --gD-bg:#3d2615; --gE:#ff7b6e; --gE-bg:#3d1c19; --gN:#98989d; --gN-bg:#2a2a2d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-num:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px;
  --c-avail:#1d4f80; --c-trend:#62b3ff; --c-lost:#b65c50;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:19px}
.brand small{font:500 12px var(--f-num);color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--accent)} .chip.err .dot{background:var(--bad)} .chip.busy .dot{background:var(--warn)}

main{max-width:1080px;margin:0 auto;padding:28px 20px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;transition:background .12s,border-color .12s}
a.btn{text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.danger:hover{color:var(--bad);background:var(--bad-soft)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn .badge{position:absolute;top:-3px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 10px/16px var(--f-num)}
svg{width:17px;height:17px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h1{font-size:28px;letter-spacing:-.025em;margin:0;line-height:1.15;text-wrap:balance}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* home */
.home-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-name{font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.card-actions{display:flex;gap:2px;opacity:.55;transition:opacity .15s}
.card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
.card-stats{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.big{font:600 26px/1 var(--f-num);letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--muted)}
.add-card{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-weight:600;min-height:150px}
.add-card:hover{color:var(--accent);border-color:var(--accent)}

/* grade pill */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:2px 8px;border-radius:6px;font:600 13px/1.5 var(--f-num);background:var(--gN-bg);color:var(--gN)}
.pill.lg{font-size:20px;min-width:58px;padding:4px 10px;border-radius:8px}
.pill.gA{background:var(--gA-bg);color:var(--gA)} .pill.gB{background:var(--gB-bg);color:var(--gB)}
.pill.gC{background:var(--gC-bg);color:var(--gC)} .pill.gD{background:var(--gD-bg);color:var(--gD)}
.pill.gE,.pill.gU{background:var(--gE-bg);color:var(--gE)}

/* score bar */
.sbar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.sbar>span{height:100%}
.sbar .e{background:var(--earned)} .sbar .l{background:var(--lost)} .sbar .r{background:var(--remaining)}
.sbar.mini{height:6px}
.sbar-wrap{position:relative;padding-bottom:20px}
.ticks{position:absolute;left:0;right:0;top:14px;height:14px}
.ticks span{position:absolute;transform:translateX(-50%);font:500 10px var(--f-num);color:var(--faint)}
.target-line{position:absolute;top:-4px;height:18px;width:2px;background:var(--fg);border-radius:1px;transform:translateX(-1px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* course view */
.course-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.course-title{flex:1;min-width:0}
.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tgt{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 0;width:42px;text-align:center;cursor:pointer;font:600 13px var(--f-num)}
.tgt:hover{border-color:var(--accent)}
.tgt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.need{font-size:14px;color:var(--muted);min-height:44px}
.need strong{display:block;font:600 24px/1.2 var(--f-num);color:var(--fg)}
.need.ok strong{color:var(--gA)} .need.no strong{color:var(--gE)}

.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:600;margin-bottom:14px}

/* table */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
.inp{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;transition:border-color .12s,background .12s}
.inp:hover{border-color:var(--line)}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inp.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.inp[readonly]{color:var(--muted);cursor:default;border-style:dashed;border-color:var(--line)}
.wt{font-family:var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.tfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 2px 0}
.tfoot .sub{margin-left:auto}
.unit{color:var(--faint);font-size:12px;margin-left:2px}

/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;animation:pop .18s}
.modal.wide{width:min(680px,100%)}
.modal.sm{width:min(400px,100%)}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-size:18px;letter-spacing:-.01em;flex:1}
.m-body{padding:16px 18px;overflow:auto}
.m-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.m-foot .spacer{flex:1}
.scale td,.scale th{padding:7px 12px}
.scale table{min-width:0}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* connect screen */
.connect{max-width:560px;margin:40px auto;text-align:left}
.connect .panel{display:flex;flex-direction:column;gap:14px;padding:26px}
.connect p{margin:0;color:var(--muted)}
.connect code{font:500 12.5px var(--f-num);background:var(--surface-2);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;z-index:30;animation:fade .15s}


/* summary */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .big{font-size:30px}
.tile .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.lvl{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.lvl .gpa-bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lvl .gpa-bar span{display:block;height:100%;background:var(--accent)}
.group-h{display:flex;align-items:baseline;gap:10px;margin:22px 2px 8px}
.group-h h2{margin:0;font-size:17px;letter-spacing:-.01em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.done i{background:var(--accent)} .status.prog i{background:var(--warn)}
.clink{background:none;border:0;padding:0;font-weight:700;cursor:pointer;color:var(--fg);text-align:left}
.clink:hover{color:var(--accent);text-decoration:underline}
.sum-tbl table{min-width:760px}
.sum-tbl td{padding:8px 10px}
.barcell{width:150px}
.pts{max-width:64px}
.chk{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.btn.on{background:var(--surface-2)}
.sum-tbl table{min-width:980px}
.sum-tbl th:first-child,.sum-tbl td:first-child{min-width:118px;white-space:nowrap}
.sum-tbl .grp{border-left:1px solid var(--line)}
.sum-tbl .grp-h th{background:var(--surface);text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.sum-tbl .status{display:flex;font-size:11.5px;margin-top:1px}
main.wide{max-width:1320px}
.lvl-row td{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);padding:6px 10px}
tfoot .tot td{font-weight:700;border-top:2px solid var(--line-strong);background:var(--surface-2)}
tfoot .tot.gpa td{border-top:1px solid var(--line)}
.chart-wrap{overflow-x:auto;margin:10px 0 6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--f-num)}
.chart .aplus{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.legend i.dash{background:none;border-top:2px dashed var(--bad);height:0;width:14px;vertical-align:3px}
.sum-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
table.mini{min-width:0}
table.mini td,table.mini th{padding:6px 10px}
.mini .tot td{font-weight:700;border-top:2px solid var(--line-strong)}

@media (max-width:760px){
  .tiles{grid-template-columns:1fr 1fr}
  .levels{grid-template-columns:1fr}
  .sum-bottom{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  h1{font-size:23px}
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">GCI <small>v5.11 web</small></div>
  <a class="btn ghost" href="https://lucahawtin.com/" title="Back to lucahawtin.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
  <div class="spacer"></div>
  <span id="saveChip" class="chip"><span class="dot"></span><span id="saveText">Not connected</span></span>
  <button class="btn ghost" id="sumBtn" title="All courses and GPA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Summary</button>
  <button class="btn ghost" id="scaleBtn" title="UC grade scale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>Grade scale</button>
  <button class="btn ghost" id="storageBtn" title="Change where data is saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="storageLabel">Storage</span></button>
</div></header>
<main id="app"></main>

<input type="file" id="importInput" accept=".csv,.zip,text/csv,application/zip" multiple hidden>

<script>
"use strict";
/* ============ Grade logic (mirrors GCI 5.11) ============ */
const GRADES=[[90,"A+"],[85,"A"],[80,"A-"],[75,"B+"],[70,"B"],[65,"B-"],[60,"C+"],[55,"C"],[50,"C-"],[40,"D"],[0,"E"]];
const MARKS=["90–100","85–89.9","80–84.9","75–79.9","70–74.9","65–69.9","60–64.9","55–59.9","50–54.9","40–49.9","0–39.9"];
const ORDER=GRADES.map(g=>g[1]);
const threshold=g=>{const f=GRADES.find(x=>x[1]===g);return f?f[0]:null};
function gradeOf(pct){
  if(pct==null||!isFinite(pct)||pct<0||pct>100+1e-9) return "UND";
  for(const [t,g] of GRADES) if(pct>=t-1e-9) return g;
  return "E";
}
function gradeClass(g){
  if(!g||g==="—") return "";
  if(g==="UND") return "gU";
  return "g"+g[0];
}
const NUM_RE=/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
function num(s){ s=(s??"").toString().trim(); if(!s) return null; return NUM_RE.test(s)?Number(s):NaN; }
const inRange=v=>v!=null&&!isNaN(v)&&v>=0&&v<=100;
const pyFloat=n=>{n=Number(n)||0; return Number.isInteger(n)?n.toFixed(1):String(n)};
const fmt=(n,d=2)=>n==null||!isFinite(n)?"—":n.toFixed(d);
const tidy=n=>{n=Number(n)||0;return String(Math.round(n*1e6)/1e6)};

function recurringAvg(rec){
  let s=0,w=0;
  for(const q of rec||[]){
    const qs=num(q.score), qw=num(q.weight);
    if(qs==null) continue;               // blank = not marked yet
    const sv=qs, wv=qw==null?0:qw;
    if(isNaN(sv)||isNaN(wv)) continue;
    s+=sv*wv; w+=wv;
  }
  return {sum:s, weight:w, avg:w>0?s/w:null};
}
function evalRow(r){
  const w=num(r.weight);
  const ra=recurringAvg(r.recurring);
  const computed=ra.weight>0;
  const raw=computed?Number(ra.avg.toFixed(2)):num(r.raw); // Python rounds the average to 2 dp before using it
  const rawBad=raw!=null&&!inRange(raw);
  const wBad=(w!=null&&!inRange(w))||(raw!=null&&!rawBad&&w==null);
  let status;
  if(rawBad||wBad) status="invalid";
  else if(raw==null) status="pending";
  else status="done";
  return {raw,w,computed,rawBad,wBad,status,
    grade:status==="done"?gradeOf(raw):status==="pending"?"—":"UND",
    weighted:status==="done"?raw*w/100:null};
}
function summarize(course){
  let total=0,completed=0,pending=0,wsum=0;
  for(const r of course.rows){
    const e=evalRow(r);
    if(e.w!=null&&!isNaN(e.w)) wsum+=e.w;
    if(e.status==="done"){total+=e.weighted;completed+=e.w;}
    else if(e.status==="pending"&&e.w>0) pending+=e.w;
  }
  return {total,completed,pending,wsum,current:completed>0?total/completed*100:null};
}
function requiredFor(s,target){
  const t=threshold(target);
  if(t==null) return null;
  if(s.total>=t-1e-9) return {kind:"secured"};
  if(s.pending<=0) return {kind:"none"};
  const need=(t-s.total)/s.pending*100;
  if(need<=100+1e-9) return {kind:"need",need};
  const max=s.total+s.pending, mg=gradeOf(max), mt=threshold(mg);
  return {kind:"unreachable",need,max,maxGrade:mg,maxNeed:Math.max(0,(mt-s.total)/s.pending*100)};
}

/* ============ CSV (same format as the Python app) ============ */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
const csvCell=v=>{v=String(v??"");return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function courseFromCSV(name,text){
  const course={name,rows:[]};
  const rows=parseCSV(text||"");
  rows.shift();
  for(const r of rows){

    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);

    if(name.endsWith("/")) continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true); const raw=u8.subarray(ds,ds+csz); let data;
    if(method===0) data=raw;
    else if(method===8){ const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")); data=new Uint8Array(await new Response(s).arrayBuffer()); }
    else continue;
    out.push([name,dec.decode(data)]);
  }
  return out;
}
function exportAll(){
  const entries=[];
  for(const n of S.courses){ const c=S.data[n]; if(c&&c.rows.length) entries.push([fileFor(n),courseToCSV(c)]); }
  entries.push(["courses_config.json",JSON.stringify(S.courses)]);
  entries.push(["courses_meta.json",JSON.stringify(S.meta,null,1)]);
  const url=URL.createObjectURL(makeZip(entries));
  const a=document.createElement("a");a.href=url;a.download="GCI-all-courses.zip";document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Exported "+(entries.length-2)+" courses");
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2200);}

/* ---------- loading ---------- */
async function loadAll(){
  let txt=await store.readText("courses_config.json");
  try{S.courses=txt?JSON.parse(txt):["New Course"];}catch{S.courses=["New Course"];}
  if(!Array.isArray(S.courses)) S.courses=[];
  S.data={};
  const sorted=[...S.courses].sort(byNumber);
  if(sorted.join("|")!==S.courses.join("|")){ S.courses=sorted; saveConfig(); }
  try{S.meta=JSON.parse(await store.readText("courses_meta.json")||"{}")||{};}catch{S.meta={};}
  for(const n of S.courses) await loadCourse(n);
  idleChip(); updateStorageLabel(); go("home");
}
async function loadCourse(name){
  if(S.data[name]) return S.data[name];
  const t=await store.readText(fileFor(name));
  return S.data[name]=courseFromCSV(name,t||"");
}

function scoreBar(s,{mini=false,target=null}={}){

  if(mini) return html;
  const ticks=[0,40,50,60,70,80,90,100].map(v=>`<span style="left:${v}%">${v}</span>`).join("");
  const tl=target!=null?`<div class="target-line" style="left:${threshold(target)}%" title="Target ${esc(target)}"></div>`:"";
  return `<div class="sbar-wrap">${html}${tl}<div class="ticks">${ticks}</div></div>`;
}

/* ---------- summary page ---------- */
const GPV={"A+":9,"A":8,"A-":7,"B+":6,"B":5,"B-":4,"C+":3,"C":2,"C-":1,"D":0,"E":-1};
const gpaLabel=g=>{ if(g==null) return "—"; const f=Math.max(-1,Math.min(9,Math.floor(g+1e-9))); return Object.keys(GPV).find(k=>GPV[k]===f); };
function courseInfo(n){
  const c=S.data[n]||{rows:[]}, s=summarize(c), m=meta(n);
  const status=s.completed>=99.99?"done":s.completed>0?"prog":"none";
  const finalGrade=status==="done"?gradeOf(s.total):null;
  const curGrade=s.current!=null?gradeOf(s.current):null;
  return {n,c,s,m,status,finalGrade,curGrade,level:Math.floor(courseNum(n)/100)};
}
function gpaOf(list,trending){
  let p=0,w=0;
  for(const x of list){
    const g=x.status==="done"?x.finalGrade:(trending&&x.status==="prog"?x.curGrade:null);
    if(g==null||!(x.m.points>0)) continue;
    p+=GPV[g]*x.m.points; w+=x.m.points;
  }
  return w?{gpa:p/w,points:w}:{gpa:null,points:0};
}
function renderSummary(){
  const all=[...S.courses].sort(byNumber).map(courseInfo);
  const eng=all.filter(x=>x.m.eng);
  const G=gpaOf(all), E=gpaOf(eng), TE=gpaOf(eng,true);
  const done=all.filter(x=>x.status==="done");
  const totalPts=all.reduce((a,x)=>a+(+x.m.points||0),0);
  const avgPct=done.length?done.reduce((a,x)=>a+x.s.total,0)/done.length:null;
  const withCur=all.filter(x=>x.s.current!=null);
  const avgCur=withCur.length?withCur.reduce((a,x)=>a+x.s.current,0)/withCur.length:null;
  const T=gpaOf(all,true);
  const tile=(label,val,grade,sub)=>`<div class="tile"><span class="eyebrow">${label}</span><div class="row"><span class="big num">${val}</span>${grade?`<span class="pill ${gradeClass(grade)}">${grade}</span>`:""}</div><span class="sub">${sub}</span></div>`;
  const pill=g=>`<span class="pill ${gradeClass(g)}">${g??"—"}</span>`;
  const statusTxt={done:"Complete",prog:"In progress",none:"Not started"};
  const pct=v=>v==null?"—":fmt(v)+"%";

  /* Excel-style Overall table */
  let lastLevel=null, body="";
  for(const x of all){
    if(x.level!==lastLevel){ lastLevel=x.level; body+=`<tr class="lvl-row"><td colspan="13">${x.level>0?x.level+"00-level":"Other"}</td></tr>`; }
    const fg=x.finalGrade, cg=x.curGrade, pts=+x.m.points||0;
    body+=`<tr data-n="${esc(x.n)}">
      <td><button class="clink" data-open>${esc(x.n)}</button><div class="status ${x.status}"><i></i>${statusTxt[x.status]}</div></td>
      <td class="r num grp">${x.status==="done"?pct(x.s.total):"—"}</td><td class="c">${pill(fg)}</td>
      <td class="r"><input class="inp n pts" id="pts-${esc(x.n)}" data-pts inputmode="numeric" value="${esc(x.m.points)}" aria-label="Points for ${esc(x.n)}"></td>
      <td class="c num">${fg?GPV[fg]:"—"}</td><td class="r num">${fg?GPV[fg]*pts:"—"}</td>
      <td class="r num grp">${pct(x.s.current)}</td><td class="c">${pill(cg)}</td>
      <td class="c num">${cg?GPV[cg]:"—"}</td><td class="r num">${cg?GPV[cg]*pts:"—"}</td>
      <td class="r num grp">${x.c.rows.length?pct(x.s.completed-x.s.total):"—"}</td><td class="r num">${x.c.rows.length?pct(100-(x.s.completed-x.s.total)):"—"}</td>
      <td class="c"><input type="checkbox" class="chk" id="eng-${esc(x.n)}" data-eng ${x.m.eng?"checked":""} aria-label="Count ${esc(x.n)} in Engineering GPA"></td>
    </tr>`;
  }
  const sumAch=list=>list.reduce((a,x)=>{const g=x.finalGrade;return a+(g?GPV[g]*(+x.m.points||0):0)},0);
  const sumAchC=list=>list.reduce((a,x)=>{const g=x.curGrade;return a+(g?GPV[g]*(+x.m.points||0):0)},0);
  const avgG=(list,k)=>{const v=list.filter(x=>x[k]).map(x=>GPV[x[k]]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const lostSum=all.reduce((a,x)=>a+(x.c.rows.length?x.s.completed-x.s.total:0),0);
  const foot=`<tr class="tot"><td>Total</td>
      <td class="r num grp">${pct(avgPct)}</td><td class="c">${pill(avgPct==null?null:gradeOf(avgPct))}</td><td class="r num">${totalPts}</td>
      <td class="c num">${avgG(all,"finalGrade")==null?"—":fmt(avgG(all,"finalGrade"))}</td><td class="r num">${sumAch(all)}</td>
      <td class="r num grp">${pct(avgCur)}</td><td class="c">${pill(avgCur==null?null:gradeOf(avgCur))}</td>
      <td class="c num">${avgG(all,"curGrade")==null?"—":fmt(avgG(all,"curGrade"))}</td><td class="r num">${sumAchC(all)}</td>
      <td class="grp"></td><td></td><td></td></tr>
    <tr class="tot gpa"><td>GPA</td><td class="grp" colspan="4"></td><td class="r num">${G.gpa==null?"—":fmt(G.gpa)}</td>
      <td class="grp" colspan="3"></td><td class="r num">${T.gpa==null?"—":fmt(T.gpa)}</td><td class="grp" colspan="3"></td></tr>`;
  const table=`<div class="tbl-wrap sum-tbl"><table>
    <thead><tr class="grp-h"><th></th><th colspan="5" class="grp">Actual percentages <span class="sub">(completed courses)</span></th><th colspan="4" class="grp">Weighted percentages of done work</th><th colspan="2" class="grp">Progress</th><th></th></tr>
    <tr><th>Course</th><th class="r grp">Percentage</th><th class="c">Grade</th><th class="r">Points</th><th class="c">GPA value</th><th class="r">Pts achieved</th>
      <th class="r grp">Percentage</th><th class="c">Grade</th><th class="c">GPA value</th><th class="r">Pts achieved</th>
      <th class="r grp">Lost</th><th class="r">Available</th><th class="c" title="Counts toward Engineering GPA">Eng.</th></tr></thead>
    <tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`;

  /* Subject Progress chart (like the Excel chart) */
  const series=[["Total % available","--c-avail",x=>x.c.rows.length?100-(x.s.completed-x.s.total):null],
                ["Current weighted score","--earned",x=>x.c.rows.length?x.s.total:null],
                ["Trending grade","--c-trend",x=>x.s.current],
                ["Lost marks","--c-lost",x=>x.c.rows.length?x.s.completed-x.s.total:null]];
  const gw=46, bw=9, padL=40, padB=46, H=260, W=padL+all.length*gw+10, y=v=>10+(100-v)/100*(H-10-padB);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;max-width:none" role="img" aria-label="Subject progress by course">`;
  for(let v=0;v<=100;v+=20) svg+=`<line x1="${padL}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${padL-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}%</text>`;
  all.forEach((x,i)=>{
    const gx=padL+i*gw+5;
    series.forEach(([lab,col,f],k)=>{const v=f(x); if(v==null) return; const h=Math.max(0,Math.min(100,v));
      svg+=`<rect x="${gx+k*bw}" y="${y(h)}" width="${bw-1}" height="${y(0)-y(h)}" style="fill:var(${col})"><title>${esc(x.n)} · ${lab}: ${fmt(v)}%</title></rect>`;});
    svg+=`<text x="${gx+2*bw}" y="${H-padB+14}" class="ax" text-anchor="end" transform="rotate(-45 ${gx+2*bw} ${H-padB+14})">${esc(x.n)}</text>`;
  });
  svg+=`<line x1="${padL}" x2="${W-6}" y1="${y(90)}" y2="${y(90)}" class="aplus"/><text x="${W-8}" y="${y(90)-4}" class="ax" text-anchor="end">A+ (90%)</text></svg>`;
  const legend=series.map(([l,c])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join("")+`<span><i class="dash"></i>A+ line</span>`;

  const levels=[...new Set(all.map(x=>x.level))].filter(l=>l>0).sort((a,b)=>b-a);
  const lvlRows=levels.map(l=>{const L=gpaOf(all.filter(x=>x.level===l)),Tl=gpaOf(all.filter(x=>x.level===l),true);
    return `<tr><td>${l}00-level</td><td class="r num">${L.gpa==null?"—":fmt(L.gpa)}</td><td class="r num">${Tl.gpa==null?"—":fmt(Tl.gpa)}</td></tr>`;}).join("");
  const scaleRows=GRADES.map(([t,g],i)=>`<tr><td>${pill(g)}</td><td class="c num">${9-i}</td><td class="num">${MARKS[i]}</td></tr>`).join("");

  app.innerHTML=`<div class="home-head"><div><div class="eyebrow">Overview</div><h1>Summary</h1></div><div class="spacer"></div>
      <button class="btn" id="toCourses">${I.back}Courses</button></div>
    <div class="tiles">
      ${tile("GPA",G.gpa==null?"—":fmt(G.gpa),G.gpa==null?null:gpaLabel(G.gpa),`${G.points} of ${totalPts} points complete`)}
      ${tile("Engineering GPA",E.gpa==null?"—":fmt(E.gpa),E.gpa==null?null:gpaLabel(E.gpa),"completed courses ticked “Eng.”")}
      ${tile("Trending Eng. GPA",TE.gpa==null?"—":fmt(TE.gpa),TE.gpa==null?null:gpaLabel(TE.gpa),"adds current averages of courses in progress")}
      ${tile("Average mark",avgPct==null?"—":fmt(avgPct,1)+'<span class="unit">%</span>',avgPct==null?null:gradeOf(avgPct),`across ${done.length} completed courses`)}
    </div>
    ${table}
    <section class="panel" style="margin-top:16px"><div class="eyebrow">Subject progress</div>
      <div class="chart-wrap">${svg}</div><div class="legend">${legend}</div></section>
    <div class="sum-bottom">
      <section class="panel"><div class="eyebrow" style="margin-bottom:8px">GPA by level</div>
        <table class="mini"><thead><tr><th>Level</th><th class="r">GPA</th><th class="r">Trending</th></tr></thead><tbody>${lvlRows}
        <tr class="tot"><td>Engineering</td><td class="r num">${E.gpa==null?"—":fmt(E.gpa)}</td><td class="r num">${TE.gpa==null?"—":fmt(TE.gpa)}</td></tr></tbody></table></section>
      <section class="panel"><div class="eyebrow" style="margin-bottom:8px">Grade scale</div>
        <table class="mini"><thead><tr><th>Grade</th><th class="c">GPA value</th><th>Marks (%)</th></tr></thead><tbody>${scaleRows}</tbody></table></section>
    </div>
    <p class="sub" style="margin-top:14px">GPA uses UC grade values (A+ = 9 … E = −1), weighted by points. A course is complete once its marked work covers 100% of the weight; until then it only counts in the trending figures. Untick “Eng.” for courses that don't count toward Engineering GPA.</p>`;
  $("#toCourses").onclick=()=>go("home");
  app.querySelectorAll("tbody tr[data-n]").forEach(tr=>{
    const n=tr.dataset.n;
    tr.querySelector("[data-open]").onclick=()=>go("course",n);
    tr.querySelector("[data-pts]").onchange=e=>{const v=num(e.target.value); if(v==null||isNaN(v)||v<0){e.target.classList.add("bad");return;} meta(n).points=v; saveMeta(); renderSummary();};
    tr.querySelector("[data-eng]").onchange=e=>{meta(n).eng=e.target.checked; saveMeta(); renderSummary();};
  });
}

/* ---------- small dialogs ---------- */
function modal(html,cls="sm"){const sc=document.createElement("div");sc.className="scrim";sc.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;document.body.append(sc);return sc;}
function askText(title,label,initial=""){
  return new Promise(res=>{
    const sc=modal(`<form><div class="m-head"><h2>${esc(title)}</h2></div><div class="m-body"><label class="eyebrow" for="askIn">${esc(label)}</label>
      <input id="askIn" class="inp" style="border-color:var(--line-strong);margin-top:6px;padding:9px 10px" value="${esc(initial)}" autocomplete="off"></div>
      <div class="m-foot"><span class="spacer"></span><button type="button" class="btn ghost" data-c>Cancel</button><button class="btn primary">Save</button></div></form>`);
    const inp=sc.querySelector("input"); inp.focus(); inp.select();
    const done=v=>{sc.remove();res(v);};
    sc.querySelector("form").onsubmit=e=>{e.preventDefault();done(inp.value.trim()||null);};
    sc.querySelector("[data-c]").onclick=()=>done(null);
    sc.onkeydown=e=>{if(e.key==="Escape")done(null);};
  });
}
function confirmBox(title,msg,okLabel="OK"){
  return new Promise(res=>{
    const sc=modal(`<div class="m-head"><h2>${esc(title)}</h2></div><div class="m-body"><p style="margin:0;color:var(--muted)">${esc(msg)}</p></div>
      <div class="m-foot"><span class="spacer"></span><button class="btn ghost" data-c>Cancel</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`);
    const done=v=>{sc.remove();res(v);};
    sc.querySelector("[data-c]").onclick=()=>done(false);
    const ok=sc.querySelector("[data-ok]"); ok.onclick=()=>done(true); ok.focus();
    sc.onkeydown=e=>{if(e.key==="Escape")done(false);};
  });
}
function showScale(){
  const rows=GRADES.map(([t,g],i)=>`<tr><td><span class="pill ${gradeClass(g)}">${g}</span></td><td class="c num">${9-i}</td><td class="num">${MARKS[i]}</td></tr>`).join("");
  const sc=modal(`<div class="m-head"><h2>Grade scale</h2><button class="icon-btn" data-c title="Close">${I.x}</button></div>
    <div class="m-body scale"><table><thead><tr><th>Grade</th><th class="c">GPA value</th><th>Marks (%)</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  const done=()=>sc.remove();
  sc.querySelector("[data-c]").onclick=done; sc.addEventListener("mousedown",e=>{if(e.target===sc)done();});
  sc.tabIndex=-1; sc.focus(); sc.onkeydown=e=>{if(e.key==="Escape")done();};
}
$("#scaleBtn").onclick=showScale;
$("#sumBtn").onclick=()=>{ if(store.mode) go("summary"); };

function download(name,text){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"})); a.download=name;
  document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
$("#importInput").onchange=async e=>{
  try{
    const items=[];
    for(const f of e.target.files){
      if(/\.zip$/i.test(f.name)) items.push(...await readZip(await f.arrayBuffer()));
      else items.push([f.name,await f.text()]);
    }
    let count=0;
    for(const [path,text] of items){
      const base=path.split("/").pop();
      if(base.startsWith("._")||path.includes("__MACOSX")) continue;
      if(/^courses_meta\.json$/i.test(base)){
        try{ Object.assign(S.meta,JSON.parse(text)); saveMeta(); }catch{}
        continue;
      }
      if(!/\.csv$/i.test(base)) continue;
      const name=base.replace(/\.csv$/i,"");
      S.data[name]=courseFromCSV(name,text);
      if(!S.courses.includes(name)){ S.courses.push(name); S.courses.sort(byNumber); }
      await store.writeText(fileFor(name),text); count++;
    }
    saveConfig(); toast("Imported "+count+" course"+(count===1?"":"s"));
  }catch(err){ toast("Couldn't import: "+err.message); }
  e.target.value=""; go("home");
};

/* ============ Storage selection ============ */
function updateStorageLabel(){ $("#storageLabel").textContent=store.mode==="folder"?store.dir.name:"Browser storage"; }
async function useFolder(handle){
  store.mode="folder"; store.dir=handle; ls.set("gci:mode","folder"); await idb.set("dir",handle); await loadAll();
}
async function pickFolder(){
  try{ const h=await window.showDirectoryPicker({id:"gci",mode:"readwrite"}); await useFolder(h); }
  catch(e){ if(e.name!=="AbortError") toast("Couldn't open that folder: "+e.message); }
}
async function useBrowser(){ store.mode="browser"; store.dir=null; ls.set("gci:mode","browser"); await loadAll(); }

function connectScreen(saved){
  setChip("", "Not connected");
  app.innerHTML=`<div class="connect"><div class="panel">
    <div><div class="eyebrow">GCI 5.11 web</div><h1 style="margin-top:4px">${saved?"Reconnect your GCI folder":"Open your GCI folder"}</h1></div>
    <p>Pick the folder where you want to keep your marks. The GCI folder this app came in works well, or a folder in OneDrive if you want your marks on more than one computer.</p>
    <p>GCI saves <code>courses_config.json</code> and one <code>COURSE.csv</code> per course in that folder, the same files the GCI 5.11 Python app uses. When the browser asks for access, choose <strong>Allow on every visit</strong> so GCI opens straight to your courses next time.</p>
    ${saved?`<p>Last used folder: <code>${esc(saved.name)}</code>. Your browser needs one click to allow access again.</p>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${saved?`<button class="btn primary" id="reconnect">Reconnect to ${esc(saved.name)}</button>`:""}
      <button class="btn ${saved?"":"primary"}" id="pick">${saved?"Choose a different folder":"Choose GCI folder"}</button>
      <button class="btn ghost" id="browser">Use browser storage instead</button>
    </div></div></div>`;
  if(saved) $("#reconnect").onclick=async()=>{ try{ if(await saved.requestPermission({mode:"readwrite"})==="granted") await useFolder(saved); }catch(e){toast(e.message)} };
  $("#pick").onclick=pickFolder;
  $("#browser").onclick=useBrowser;
}
$("#storageBtn").onclick=async()=>{
  if(!FS_OK){ toast("This browser can only save to its own storage. Use Chrome or Edge for folder access."); return; }
  const saved=await idb.get("dir"); S.view="connect"; connectScreen(saved);
};

(async function init(){
  const mode=ls.get("gci:mode");
  if(!FS_OK) return useBrowser();
  if(mode==="browser") return useBrowser();
  const saved=await idb.get("dir");
  if(saved){
    try{ if(await saved.queryPermission({mode:"readwrite"})==="granted") return useFolder(saved); }catch{}
  }
  connectScreen(saved);
})();
</script>
